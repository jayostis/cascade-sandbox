name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The runtime's own tests of the rulings a sandbox pull request could break, run against this pull request's sandbox:
  # on the runtime pull request a `Depends-On:` line names, else on its main.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sandbox
          persist-credentials: false
      - id: runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          body=""
          if [ -n "$NUMBER" ]; then body="$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json body -q .body)"; fi
          number="$(printf '%s\n' "$body" | sed -nE 's#^Depends-On: https://github.com/jayostis/cascade-runtime-js/pull/([0-9]+)[[:space:]]*$#\1#p' | head -n 1)"
          if [ -n "$number" ]; then ref="refs/pull/${number}/head"; else ref=main; fi
          echo "the runtime at ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: jayostis/cascade-runtime-js
          ref: ${{ steps.runtime.outputs.ref }}
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sandbox/package-lock.json
            runtime/package-lock.json
      - run: npm ci
        working-directory: sandbox
      - run: npm ci
        working-directory: runtime
      - name: install this build over the pin of every workspace that declares the sandbox
        shell: bash
        working-directory: runtime
        run: |
          set -euo pipefail
          npm query .workspace > "$RUNNER_TEMP/workspaces.json"
          mapfile -t flags < <(node -e '
            const fs = require("fs");
            for (const w of JSON.parse(fs.readFileSync(process.argv[1], "utf8"))) {
              const p = JSON.parse(fs.readFileSync(w.location + "/package.json", "utf8"));
              const all = { ...p.dependencies, ...p.devDependencies, ...p.optionalDependencies, ...p.peerDependencies };
              if ("@the-cascade-protocol/sandbox" in all) { console.log("-w"); console.log(w.location); }
            }' "$RUNNER_TEMP/workspaces.json")
          [ "${#flags[@]}" -gt 0 ] || { echo "no workspace declares the sandbox"; exit 1; }
          npm install --no-save --install-links "${flags[@]}" "$GITHUB_WORKSPACE/sandbox"
      - name: every installed sandbox is this build
        shell: bash
        working-directory: runtime
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r copy; do
            diff -r "$GITHUB_WORKSPACE/sandbox/dist/src" "$copy/dist/src" > /dev/null || { echo "$copy is not this build"; exit 1; }
            found=$((found + 1))
          done < <(find . -path '*/node_modules/@the-cascade-protocol/sandbox' -prune -print)
          [ "$found" -gt 0 ] || { echo "no installed sandbox"; exit 1; }
          echo "$found installed copies, all this build"
      - run: npx tsc -b
        working-directory: runtime
      - run: >-
          node --test
          packages/cascade-runtime/dist/test/connect.test.js
          packages/cascade-runtime/dist/test/pull.test.js
          packages/cascade-runtime/dist/test/directory.test.js
        working-directory: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
