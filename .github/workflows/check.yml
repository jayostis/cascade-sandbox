name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: actions/checkout@v7
        with:
          repository: jayostis/cascade-runtime-js
          ref: main
          path: .runtime-js
          sparse-checkout: |
            scripts
            packages/site/src
          persist-credentials: false
      - run: npm run build:test
      - run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./.runtime-js/scripts/junit-reporter.mjs --test-reporter-destination=report/junit.xml
          "dist/test/**/*.test.js"
      - if: ${{ !cancelled() }}
        run: node .runtime-js/scripts/spec-shape.mjs report/junit.xml test/spec.json
      - if: ${{ !cancelled() }}
        run: cp test/spec.json report/spec.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-tests
          path: report/
          if-no-files-found: error

  people:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pin
        run: |
          echo "repository=$(node -p "new URL(require('./vocabulary.json').repository).pathname.slice(1)")" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./vocabulary.json').commit")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: cascade-vocabulary
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run people -- --check cascade-vocabulary
