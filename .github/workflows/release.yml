name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      commit:
        description: The commit on main to release, when it is not the head of main.
        required: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pack.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          persist-credentials: false
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$(git rev-parse HEAD) is not on main"; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: pack
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          npm pkg set "version=0.0.0-commit-$commit"
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  release:
    needs: pack
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.pack.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-$COMMIT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          file=$(ls package/*.tgz)
          gh release create "$tag" "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "$tag" \
            --notes "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$(basename "$file")" \
            --prerelease \
            --latest=false
